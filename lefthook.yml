commit-msg:
  commands:
    conventional-commit:
      run: |
        subject=$(head -n 1 "{1}")
        case "$subject" in
          Merge\ *)
            exit 0
            ;;
        esac
        len=${#subject}
        if [ "$len" -eq 0 ] || [ "$len" -gt 72 ]; then
          echo "ERROR: Commit subject must be between 1 and 72 characters (got $len)." >&2
          echo "  Subject: $subject" >&2
          echo "  Format:  <type>(<scope>): <imperative lowercase summary>" >&2
          exit 1
        fi
        case "$subject" in
          *.)
            echo "ERROR: Commit subject must not end with a trailing period." >&2
            echo "  Subject: $subject" >&2
            exit 1
            ;;
        esac
        pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf)\((runtime|host|registry|approval|mcp|cli|schema|docs|ci|deps)\)!?: [a-z0-9]'
        if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
          echo "ERROR: Invalid commit message subject." >&2
          echo "  Subject:        $subject" >&2
          echo "  Expected:       <type>(<scope>): <imperative lowercase summary>" >&2
          echo "  Allowed types:  feat, fix, docs, chore, refactor, test, ci, build, perf" >&2
          echo "  Allowed scopes: runtime, host, registry, approval, mcp, cli, schema, docs, ci, deps" >&2
          echo "  Breaking:       <type>(<scope>)!: <summary> (or BREAKING CHANGE: footer)" >&2
          exit 1
        fi

pre-commit:
  parallel: false
  commands:
    fmt-check:
      glob: "*.go"
      run: mise run fmt-check
    lint:
      glob: "*.go"
      run: mise run lint
